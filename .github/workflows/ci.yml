name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Verify Compact Artifacts
        run: |
          if command -v compact &> /dev/null; then
            npm run compile
          else
            echo "Compact compiler checking managed artifacts"
            test -d managed/counter
          fi
      - name: Run Test Suite
        run: npm test
      - name: Build Frontend
        run: npm run build
